name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The end-to-end tests skip here: no Obsidian Web Clipper CLI, and no Playwright.
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
